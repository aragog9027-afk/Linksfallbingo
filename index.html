<main>

<script>
/* ====== SETTINGS: edit these ====== */
const SHEET_ID = "1SKzi4cDW3x22aZsw2KVV7PiK5YyJV3_2yPdvc2pRTeo";  // the long ID in the sheet's address: docs.google.com/spreadsheets/d/<THIS PART>/edit
const TEAM_TABS = [ // [label, gid] – the gid is the number after "gid=" in each tab's address
  ["Team 1","416843436"],["Team 2","812537617"],["Team 3","2104094295"],
  ["Team 4","1310723156"],["Team 5","577190997"],["Team 6","269903896"]
];
const REFRESH_SECONDS = 8;
const COLORS = ["#c0392b","#2980b9","#27ae60","#f39c12","#8e44ad","#16a085"];

/* Tile icons from the OSRS wiki. Format:  "tile name as shown on the board": "wiki item name"
   Add one line per tile. Tiles without a line simply show no icon. */
const ICONS = {
  "DT2 Ring Drops (x3)": "Gold ring",
  "Pharaohs Sceptre": "Pharaoh's sceptre",
  "Twinflame Staff Pieces": "Twinflame staff",
  "Blood Shard": "Blood shard",
  "Demonic Brutus": "Demonic Brutus",
  "2m Sailing XP": "Sailing icon",
  "Armadyl Crossbow": "Armadyl crossbow",
  "Unsired (x3)": "Unsired",
  "Tonalztics of Ralos": "Tonalztics of ralos",
  "Eye of Ayak": "Eye of ayak",
  "Tormented Synapse (x2)": "Tormented synapse",
  "Yama Uniques (x3)": "Oathplate chest",
  "Avernic Treads": "Avernic treads",
  "Torva Piece": "Torva platebody",
  "Nightmare Unique": "Inquisitor's hauberk",
  "Ancestral Piece": "Ancestral robe top",
  "Zenyte (x3)": "Zenyte shard",
  "Hydra Claw": "Hydra claw",
  "Nihil Horn": "Nihil horn",
  "Mega Rare": "Twisted bow",
  "Enhanced": "Enhanced crystal weapon seed",
  "Complete Voidwaker": "Voidwaker",
  "1m RC XP": "Runecraft icon",
  "Burning Claws": "Burning claws",
  "2 Soulreaper Axe Pieces": "Soulreaper axe",
  "Imbued Heart": "Imbued heart",
  "Justiciar Piece": "Justiciar faceguard",
  "Mutagen": "Tanzanite mutagen",
  "Each Cerb Crystal": "Primordial crystal",
  "Lightbearer/Fang": "Lightbearer",
  "Masori Piece": "Masori body (f)",
  "Zulrah Fangs (x2)": "Tanzanite fang",
  "Dragon Warhammer": "Dragon warhammer",
  "Mokhaiotl Cloth": "Mokhaiotl cloth",
  "Venator Shard (x3)": "Venator shard",
  "Any Draconic Visage": "Draconic visage",
  "Scurrius Spine (x3)": "Scurrius' spine",
  "Barrows Item (x4)": "Dharok's greataxe",
  "Virtus Piece": "Virtus robe top",
  "Golden Tench": "Golden tench",
  "COX Prayer Scroll": "Dexterous prayer scroll",
};

/* Tiles made of specific named items. The cell under the tile just needs to mention each item you have (e.g. "Prim & Peg").
   Format:  "tile name": { "item name shown in the popup": "word to look for in the cell" }
   Other multi-item tiles ("1 of 3" in the cell) are counted automatically. */
const TILE_ITEMS = {
  "Each Cerb Crystal": { "Primordial crystal":"prim", "Pegasian crystal":"peg", "Eternal crystal":"etern" },
  "Complete Voidwaker": { "Voidwaker gem":"gem", "Voidwaker hilt":"hilt", "Voidwaker blade":"blade" },
};
/* Tiles that need a set number of pieces but have no (x2)/(x3) in their name. Cell under the tile can say "1 of 2" or be ticked. */
const TILE_TOTALS = { "Twinflame Staff Pieces": 2 };
/* Tiles completed by any one of several PAIRS. The cell under the tile can hold several items (multi-select dropdown, e.g. "Mace, Claws").
   Format: "tile name": { pairs:[[item, item], ...], words:{ "item": "word to look for in the cell" } } */
const TILE_PAIRS = {
  "Wildy Weapon": {
    pairs:[["Mace","Claws"],["Bow","Fangs"],["Sceptre","Skull"]],
    words:{Mace:"mace",Bow:"bow",Sceptre:"sceptre",Claws:"claws",Fangs:"fangs",Skull:"skull"}
  }
};
/* Bonus points for completed lines (not displayed anywhere) */
const BONUS_ROW = 1, BONUS_COL = 1, BONUS_DIAG = 3;
/* ================================== */

let teams = [], countdown = REFRESH_SECONDS;
const $ = id => document.getElementById(id);

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(cell);cell=""}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=""}
    else if(ch!=='\r') cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

let seq=0; const pending={};
window.google=window.google||{}; google.visualization=google.visualization||{}; google.visualization.Query=google.visualization.Query||{};
google.visualization.Query.setResponse=d=>{const p=pending[d.reqId]; if(p){delete pending[d.reqId]; p(d)}};
function jsonp(tab,sel){
  return new Promise((res,rej)=>{
    const id=String(++seq), el=document.createElement("script");
    const finish=()=>{clearTimeout(t);delete pending[id];el.remove()};
    const t=setTimeout(()=>{finish();rej(new Error(`"${tab}" timed out – the sheet may not be shared as "Anyone with the link"`))},15000);
    pending[id]=d=>{finish();res(d)};
    el.onerror=()=>{finish();rej(new Error(`couldn't reach Google for "${tab}"`+(window.self!==window.top?" (this page is inside a preview window – open it in a normal browser tab)":"")))};
    el.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;reqId:${id}&${sel}`;
    document.head.appendChild(el);
  });
}

const useSel={};  // remembers which address worked for each tab, so each refresh needs just one request per team
async function loadTeam([tab,gid], i){
  const tries=[...new Set([useSel[tab],"sheet="+encodeURIComponent(tab),"gid="+gid])].filter(Boolean);  // tab name first: it survives re-uploading/copying the sheet, gids do not
  let err;
  for(const sel of tries){
    try{ const team=await loadFrom(tab,sel,i); useSel[tab]=sel; return team }
    catch(e){ err=e }  // fall back to the tab name if the gid is wrong (e.g. the sheet was re-imported)
  }
  throw err;
}
const TOTALS_LC=Object.fromEntries(Object.entries(TILE_TOTALS).map(([k,v])=>[k.toLowerCase().trim(),v]));
const PAIRS_LC=Object.fromEntries(Object.entries(TILE_PAIRS).map(([k,v])=>[k.toLowerCase().trim(),v]));
const ITEMS_LC=Object.fromEntries(Object.entries(TILE_ITEMS).map(([k,v])=>[k.toLowerCase().trim(),v]));
async function loadFrom(tab,sel,i){
  const d=await jsonp(tab,sel);
  if(d.status==="error") throw new Error(`"${tab}": ${(d.errors&&d.errors[0]&&d.errors[0].detailed_message)||"sheet error"}`);
  const grid=d.table.rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?String(c.v).trim():""));
  const at=(r,c)=>(grid[r]||[])[c]||"";
  const tiles=[]; let points=0, done=0, bonus=0;
  // Google treats the first rows as a header, so team name + players arrive as one column label
  const lab=((d.table.cols||[]).map(c=>c.label||"").find(l=>/Players:/i.test(l)))||"";
  const pi=lab.search(/Players:/i);
  let name=pi>0?lab.slice(0,pi).trim():"", players=pi>=0?lab.slice(pi).replace(/^Players:\s*/i,""):"";
  grid.forEach((row,r)=>row.forEach((raw,c)=>{
    if(!raw) return;
    if(!name && r<3 && !/^(Players:|Tiles done|Click)/i.test(raw)) name=raw;
    if(!players && /^Players:/i.test(raw)) players=raw.replace(/^Players:\s*/i,"");
    const m=raw.match(/\((\d+)\s*pts?\)/i);
    if(!m) return;
    const pts=+m[1], title=raw.replace(/\(\d+\s*pts?\)/i,"").trim();
    const tv=at(r+1,c); let on=/^(☑|true)/i.test(tv);
    const named=ITEMS_LC[title.toLowerCase()], pr=PAIRS_LC[title.toLowerCase()];
    let need=0, have=0, items=null, pairs=null;
    if(pr){  // any one complete pair completes the tile
      const lc=tv.toLowerCase(), got=n=>on||new RegExp("\\b"+pr.words[n].toLowerCase()).test(lc);
      items=Object.keys(pr.words).map(label=>({label,got:got(label)}));
      pairs=pr.pairs.map(p=>({a:p[0],b:p[1],ag:got(p[0]),bg:got(p[1])}));
      have=items.filter(it=>it.got).length;
      if(pairs.some(p=>p.ag&&p.bg)) on=true;
    }else if(named){  // named items: tick off each one the cell mentions
      items=Object.entries(named).map(([label,word])=>({label,got:on||tv.toLowerCase().includes(word.toLowerCase())}));
      need=items.length; have=items.filter(it=>it.got).length;
    }else{      // counted items: "1 of 3" in the cell; once ticked ☑ the (x3) / leading number in the title gives the total
      const pm=tv.match(/(\d+)\s*of\s*(\d+)/i), tm=on&&(title.match(/\(x\s*(\d+)\)/i)||title.match(/^(\d+)\s/));
      const tot=TOTALS_LC[title.toLowerCase()]||0;
      need=pm?+pm[2]:tm?+tm[1]:tot; have=on?need:pm?+pm[1]:0;
    }
    if(on){points+=pts;done++}
    tiles.push({title,pts,on,need,have,items,pairs,r,c});
  }));
  if(!tiles.length) throw new Error(`"${tab}" has no tiles – check the gid`);
  // line bonuses: place tiles on the board by their position in the sheet, then check rows, columns and both diagonals
  const rs=[...new Set(tiles.map(t=>t.r))].sort((a,b)=>a-b), cs=[...new Set(tiles.map(t=>t.c))].sort((a,b)=>a-b);
  const N=Math.round(Math.sqrt(tiles.length)), square=N*N===tiles.length&&N>1;
  let B=null, maxBonus=0;
  if(square){
    B=Array.from({length:N},()=>Array(N).fill(null));
    if(rs.length===N&&cs.length===N) tiles.forEach(t=>{B[rs.indexOf(t.r)][cs.indexOf(t.c)]=t});
    else tiles.forEach((t,i)=>{B[Math.floor(i/N)][i%N]=t});
    maxBonus=N*BONUS_ROW+N*BONUS_COL+2*BONUS_DIAG;
    const full=cells=>cells.every(t=>t&&t.on);
    for(let i=0;i<N;i++){
      if(full(B[i])) bonus+=BONUS_ROW;
      if(full(B.map(row=>row[i]))) bonus+=BONUS_COL;
    }
    if(full(B.map((row,i)=>row[i]))) bonus+=BONUS_DIAG;
    if(full(B.map((row,i)=>row[N-1-i]))) bonus+=BONUS_DIAG;
    points+=bonus;
  }
  return {name:name||tab, players, tiles, points, done, bonus, maxBonus, color:COLORS[i%COLORS.length]};
}

let busy=false, lastData="";
async function refresh(){
  if(busy) return; busy=true;
  try{
    const fresh=await Promise.all(TEAM_TABS.map(loadTeam));
    $("err").style.display="none";
    const data=JSON.stringify(fresh);
    if(data!==lastData){ lastData=data; teams=fresh; render(); renderModal() }  // only redraw when something changed, so nothing flickers
    $("status").innerHTML=`Updated <b>${new Date().toLocaleTimeString()}</b> · next in <span id="cd">${REFRESH_SECONDS}</span>s`;

/* Shown under "Doesn't count" on every tile (except auto-tracked ones), from the General Rules */
const GENERAL_EXCLUDES = [
  "Drops on an account that isn't signed up for the bingo",
  "Drops not posted in #bingo-submissions within 12 hours, or without a valid screenshot",
  "Screenshots from any client other than RuneLite, Mobile or the Official Client",
];
const RULES_LC=Object.fromEntries(Object.entries(TILE_RULES).map(([k,v])=>[k.toLowerCase().trim(),v]));
const WIKI="https://oldschool.runescape.wiki/";
const LOCAL_LC=Object.fromEntries(Object.entries(LOCAL_ICONS).map(([k,v])=>[k.toLowerCase().trim(),v]));
const ICONS_LC=Object.fromEntries(Object.entries(ICONS).map(([k,v])=>[k.toLowerCase().trim(),v]));
function icon(title){
  const loc=LOCAL_LC[title.toLowerCase().trim()];
  if(loc) return `<img class="ic loc" alt="" src="${loc}">`;
  const f=ICONS_LC[title.toLowerCase().trim()]; if(!f) return "";
  const file=encodeURIComponent(f.replace(/ /g,"_")).replace(/'/g,"%27");
  return `<img class="ic" alt="" loading="lazy" src="${WIKI}images/${file}.png" data-alt="${WIKI}w/Special:FilePath/${file}.png" onerror="if(this.dataset.alt){this.src=this.dataset.alt;delete this.dataset.alt}else{this.style.display='none'}">`;
}
let openTeam=-1;
function render(){
  // remember which tile/row had keyboard focus so a refresh doesn't knock it off
  const foc=document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".row[data-i],.t[data-k]");
  const focSel=foc?(foc.dataset.i!=null?`.row[data-i="${foc.dataset.i}"]`:`.t[data-k="${foc.dataset.k}"]`):null;
  const total=teams[0]?teams[0].tiles.reduce((a,t)=>a+t.pts,0)+teams[0].maxBonus:0;
  const order=teams.map((t,i)=>i).sort((a,b)=>teams[b].points-teams[a].points);
  $("lead").innerHTML=order.map((i,pos)=>{const t=teams[i];
    return `<div class="row" tabindex="0" role="button" aria-pressed="${openTeam===i}" aria-expanded="${openTeam===i}" data-i="${i}" style="--c:${t.color}">
      <div class="rk">${pos+1}</div>
      <div><div class="nm">${esc(t.name)}</div><div class="sub">${t.done} / ${t.tiles.length} tiles</div>
      <div class="bar"><i style="width:${total?Math.min(100,t.points/total*100):0}%"></i></div></div>
      <div class="pt">${t.points}</div></div>`}).join("");
  const t=teams[openTeam];
  $("board").innerHTML=t?`<section class="team" style="--c:${t.color}">
      <h2>${esc(t.name)}<span>${t.points} pts</span></h2>
      <div class="players">${esc(t.players)}</div>
      <div class="grid">${t.tiles.map((x,ki)=>`<div class="t${x.on?" on":x.have>0?" part":""}" data-k="${ki}" tabindex="0" role="button" aria-label="${esc(x.title)} – ${x.on?"complete":x.have>0?`${x.pairs?x.have+" items":x.have+" of "+x.need}`:"not done"}, show details">${x.need&&!x.pairs?`<em class="pg">${x.have}/${x.need}</em>`:""}${icon(x.title)}${esc(x.title)}<small>${x.pts} pts</small></div>`).join("")}</div></section>`:"";
  if(focSel){ const el=document.querySelector(focSel); if(el) el.focus({preventScroll:true}) }
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Tile popup: status, items got so far / still needed, and any rules */
let openTile=null;  // {team, k}
const base=s=>s.replace(/\(x\s*\d+\)/i,"").replace(/^\d+\s+/,"").trim();  // "Unsired (x3)" -> "Unsired"
function openModal(k){ openTile={team:openTeam,k}; renderModal(); $("modal").hidden=false; $("mclose").focus() }
function closeModal(){
  if(!openTile) return;
  const k=openTile.k; openTile=null; $("modal").hidden=true;
  const el=document.querySelector(`.t[data-k="${k}"]`); if(el) el.focus();
}
function renderModal(){
  if(!openTile) return;
  const t=teams[openTile.team], x=t&&t.tiles[openTile.k];
  if(!x){ closeModal(); return }
  const part=!x.on&&x.have>0;
  const items=x.items||Array.from({length:x.need},(_,n)=>({label:`${base(x.title)} (${n+1} of ${x.need})`,got:n<x.have}));
  const got=items.filter(it=>it.got), still=items.filter(it=>!it.got);
  const list=(arr,mark)=>`<ul>${arr.map(it=>`<li><b>${mark}</b>${esc(it.label)}</li>`).join("")}</ul>`;
  const rule=RULES_LC[x.title.toLowerCase().trim()];
  $("modal").firstElementChild.style.setProperty("--c",t.color);
  $("mbody").innerHTML=`<div class="mhead">${icon(x.title)}<h3 id="mtitle">${esc(x.title)}</h3></div>
    <p class="mmeta">${esc(t.name)} · ${x.pts} pts<span class="mstat${x.on?" on":part?" part":""}">${x.on?"Complete ✓":part?(x.pairs?`In progress · ${x.have} item${x.have===1?"":"s"}`:`In progress · ${x.have}/${x.need}`):"Not done yet"}</span></p>
    ${x.pairs?pairsHTML(x):""}
    ${x.need&&!x.pairs?`<div class="mprog"><span class="pips">${items.map(it=>`<i${it.got?' class="got"':""}></i>`).join("")}</span>${x.have} of ${x.need} obtained</div>
    <div class="mrules mitems">
      <div class="ok"><h4>Got so far (${got.length})</h4>${got.length?list(got,"✓"):'<p class="mnone">Nothing yet</p>'}</div>
      <div class="need"><h4>Still needed (${still.length})</h4>${still.length?list(still,"○"):'<p class="mnone">Nothing – tile complete!</p>'}</div>
    </div>`:""}
    ${rulesHTML(rule)}`;
}
function pairsHTML(x){
  const m=(n,g)=>`<b style="color:${g?"#6fdc8c":"#ffb15c"}">${g?"✓":"○"}</b> ${esc(n)}`;
  const got=x.items.filter(i=>i.got), still=x.items.filter(i=>!i.got);
  const list=(arr,mk)=>`<ul>${arr.map(i=>`<li><b>${mk}</b>${esc(i.label)}</li>`).join("")}</ul>`;
  return `<div class="mprog"><span class="pips">${x.items.map(i=>`<i${i.got?' class="got"':""}></i>`).join("")}</span>${got.length} of ${x.items.length} items obtained</div>
  <div class="mrules mitems"><div class="ok"><h4>Items checked off (${got.length})</h4>${got.length?list(got,"✓"):'<p class="mnone">Nothing yet</p>'}</div>
  <div class="need"><h4>Not yet obtained (${still.length})</h4>${still.length?list(still,"○"):'<p class="mnone">All items obtained</p>'}</div></div>
  <div class="mrules mitems"><div class="ok"><h4>Combinations – any one completes the tile</h4><ul>${x.pairs.map(p=>{const d=p.ag&&p.bg;
    return `<li style="${d?"color:#6fdc8c":""}">${m(p.a,p.ag)} &nbsp;+&nbsp; ${m(p.b,p.bg)}${d?" – complete":""}</li>`}).join("")}</ul></div></div>`;
}
const bullets=(arr,cls="")=>`<ul>${arr.map((s,n)=>Array.isArray(s)?"":`<li${cls}>${esc(s)}${Array.isArray(arr[n+1])?`<ul class="sub">${arr[n+1].map(z=>`<li>${esc(z)}</li>`).join("")}</ul>`:""}</li>`).join("")}</ul>`;
function rulesHTML(rule){
  if(!rule) return `<div class="mrules"><p class="mnone">No rules listed for this tile yet.</p></div>`;
  const ex=rule.excludes||[], gen=rule.auto?[]:GENERAL_EXCLUDES;
  return `<div class="mrules">
    ${(rule.counts||[]).length?`<div class="ok"><h4>What counts</h4>${bullets(rule.counts)}</div>`:""}
    ${ex.length||gen.length?`<div class="no"><h4>Doesn't count</h4>${bullets(ex)}${bullets(gen,' class="gen"')}</div>`:""}
  </div>`;
}

const toggle=e=>{
  const el=e.target.closest(".row[data-i]"); if(!el) return;
  const i=+el.dataset.i; openTeam=(openTeam===i)?-1:i; render();
};
document.addEventListener("click",e=>{
  if(e.target.closest("#mclose")||e.target.id==="modal") return closeModal();
  const tile=e.target.closest(".t[data-k]"); if(tile) return openModal(+tile.dataset.k);
  toggle(e);
});
document.addEventListener("keydown",e=>{
  if(openTile){ if(e.key==="Escape") closeModal(); else if(e.key==="Tab"){ e.preventDefault(); $("mclose").focus() } return }
  if(e.key==="Enter"||e.key===" "){
    const tile=e.target.closest(".t[data-k]"); if(tile){ e.preventDefault(); openModal(+tile.dataset.k); return }
    if(e.target.closest(".row[data-i]")){ e.preventDefault(); toggle(e) }
  }
});

refresh();
setInterval(()=>{
  if(document.hidden) return;  // pause while the tab is in the background
  countdown--; const cd=$("cd"); if(cd)cd.textContent=Math.max(countdown,0);
  if(countdown<=0) refresh();
},1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh() });

/* Countdown: bingo ends 19 Oct 2026, 17:00 UK time (BST = UTC+1, so 16:00 UTC) */
const END_TIME=Date.UTC(2026,9,19,16,0,0);
function tickCountdown(){
  const ms=END_TIME-Date.now(), box=document.getElementById("cd");
  if(ms<=0){box.classList.add("over");document.getElementById("cdl").textContent="The bingo has ended – thanks for playing!";return}
  const p=n=>String(n).padStart(2,"0"), s=Math.floor(ms/1000);
  document.getElementById("cdd").textContent=Math.floor(s/86400);
  document.getElementById("cdh").textContent=p(Math.floor(s%86400/3600));
  document.getElementById("cdm").textContent=p(Math.floor(s%3600/60));
  document.getElementById("cds").textContent=p(s%60);
}
tickCountdown(); setInterval(tickCountdown,1000);
</script>
</body>
</html>
